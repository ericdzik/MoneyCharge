name: locacharge
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  http: ^1.2.1
  geolocator: ^9.0.2
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.6.1
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^19.3.0 # Updated to latest stable version
  timezone: ^0.10.0 # Updated to be compatible with flutter_local_notifications 19.3.0

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11

  # Pour décoder les polylignes de Google Directions API
  flutter_polyline_points: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  # Nouvelles dépendances pour les images
  firebase_storage: ^12.4.9
  image_picker: ^1.1.2
  card_swiper: ^3.0.1
  path: ^1.9.0
  image_cropper: ^5.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.6
  build_runner: ^2.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/splash/new.png
    - assets/splash/32.png
    - assets/splash/33.png
    - assets/splash/25.png
    - assets/splash/24.png
    
  # fonts:
  # - family: Inter
  #   fonts:
  #     - asset: assets/fonts/Inter-Regular.ttf
  #     - asset: assets/fonts/Inter-Medium.ttf
  #       weight: 500
  #     - asset: assets/fonts/Inter-SemiBold.ttf
  #       weight: 600
  #     - asset: assets/fonts/Inter-Bold.ttf
  #       weight: 700
  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png" 
flutter_native_splash:
  color: "#000000" # couleur de fond (sera masquée si image couvre tout)
  image: assets/splash/new.png
  android: true
  ios: true
  android_gravity: center
  fullscreen: true
  ios_content_mode: scaleToFill
