name: locacharge
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  # Base Flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.5+1
  http: ^1.2.1
  intl: ^0.19.0
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  logger: ^2.0.2+1

  # Stockage & préférences
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.1.0
  image_cropper: ^11.0.0
  image_picker: ^1.2.0
  firebase_storage: ^13.0.1

  # Géolocalisation & cartes
  geolocator: ^9.0.2
  google_maps_flutter: ^2.6.1
  flutter_polyline_points: ^3.0.1
  permission_handler: ^11.0.1

  # Notifications & partage
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.0
  share_plus: ^7.2.2
  url_launcher: ^6.2.1

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_messaging: ^16.0.2

  # Paiement & UI
  flutter_paystack_plus: ^2.2.2
  card_swiper: ^3.0.1
  fl_chart: ^0.68.0

  # Téléchargement et stockage
  path_provider: ^2.1.1

dev_dependencies:
  # Outils de développement et de test
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.6
  build_runner: ^2.6.0

  # Outil de génération d’icônes (uniquement en build)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6


flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    - assets/images/
    - .env
    - .env.example
    
